<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="brox — the package manager for AI agent skills">
  <title>brox — the package manager for AI agent skills</title>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1A1A1F" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- icon mark at top-left of the content area, 200x200 -->
  <g transform="translate(80, 100) scale(0.78125)">
    <rect width="256" height="256" rx="48" fill="#FFFFFF"/>
    <rect x="60" y="48" width="30" height="160" rx="3" fill="#0A0A0A"/>
    <circle cx="142" cy="154" r="39" fill="none" stroke="#0A0A0A" stroke-width="30"/>
  </g>

  <!-- "brox" wordmark vertically centered with the 200px icon (icon spans y=100..300) -->
  <text x="320" y="252"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="144"
        font-weight="900"
        letter-spacing="-6"
        fill="#FFFFFF">brox</text>

  <!-- tagline -->
  <text x="80" y="370"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="32"
        font-weight="400"
        fill="#A1A1AA">The package manager for AI agent skills.</text>

  <!-- install command terminal -->
  <rect x="80" y="440" width="1040" height="100" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <circle cx="116" cy="490" r="6" fill="#84CC16"/>
  <text x="140" y="500"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="28"
        font-weight="500"
        fill="#FFFFFF">$ npm i -g @broxhq/cli</text>

  <!-- url bottom-right -->
  <text x="1120" y="600"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="20"
        font-weight="500"
        fill="#71717A"
        text-anchor="end">brox.sh</text>
</svg>
